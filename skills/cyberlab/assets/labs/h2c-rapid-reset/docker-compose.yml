# summary: HTTP/2 Rapid Reset (CVE-2023-44487): nginx h2c victim, built h2 attacker, 100 HEADERS+RST_STREAM at once vs 100 streams paced 50 ms
# Run: cyberlab run <lab> attack ; cyberlab run <lab> benign      (N=<streams> to change the count)
# Pattern: a generator that needs a library gets it in an image BUILT from ./generator-image (the build
# has network access; the internal lab network has none, so `pip install` at run time fails).
# Cleartext h2c on port 80 on purpose: a network monitor cannot see inside TLS.
name: cyberlab-h2c-rapid-reset
networks:
  lab: { driver: bridge, internal: true }
services:
  victim:
    image: nginx:1.27
    networks: [lab]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  capture:
    image: ${CYBERLAB_TOOLS:-cyberlab/tools:local}
    network_mode: "service:victim"
    command: tcpdump -Z root -i eth0 -B 32768 --immediate-mode -U -w /cap/${PCAP:-attack}.pcap tcp port 80
    healthcheck: { test: ["CMD", "sh", "-c", "test -s /cap/${PCAP:-attack}.pcap"], interval: 1s, retries: 30 }
  generator:
    build: ./generator-image
    networks: [lab]
    depends_on:
      victim: { condition: service_started }
      capture: { condition: service_healthy }
    volumes: ["./h2client.py:/lab/h2client.py:ro"]
    command: python /lab/h2client.py victim ${MODE:-attack} ${N:-100}
