# summary: Web attack payloads (Log4Shell, SQLi, traversal, XXE, ...) sent in cleartext HTTP to a static nginx; edit payloads/*.jsonl
# Run: cyberlab run <lab> attack ; cyberlab run <lab> benign      (requests from payloads/<mode>.jsonl)
# The victim answers 200 to everything and executes nothing: the payloads are detection strings,
# not working exploits. Any host name inside a payload uses the .invalid TLD (never resolves).
name: cyberlab-http-payloads
networks:
  lab: { driver: bridge, internal: true }
services:
  victim:
    image: nginx:1.27-alpine
    networks: [lab]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  capture:
    image: ${CYBERLAB_TOOLS:-cyberlab/tools:local}
    network_mode: "service:victim"
    command: tcpdump -Z root -i eth0 -B 32768 --immediate-mode -U -w /cap/${PCAP:-attack}.pcap tcp port 80
    healthcheck: { test: ["CMD", "sh", "-c", "test -s /cap/${PCAP:-attack}.pcap"], interval: 1s, retries: 30 }
  generator:
    image: python:3.12-slim
    networks: [lab]
    depends_on:
      victim: { condition: service_started }
      capture: { condition: service_healthy }
    volumes: ["./client.py:/lab/client.py:ro", "./payloads:/lab/payloads:ro"]
    command: python /lab/client.py victim /lab/payloads/${MODE:-attack}.jsonl
