# Real FTP server behaviour for the lab: local logins, failed logins answered "530" after a delay.
ServerName          "lab ftp"
ServerType          standalone
DefaultServer       on
Port                21
UseIPv6             off
User                nobody
Group               nogroup
UseReverseDNS       off
RequireValidShell   off
AuthOrder           mod_auth_unix.c
DefaultRoot         ~
PassivePorts        30000 30010
MaxLoginAttempts    3
MaxInstances        30
WtmpLog             off
<IfModule mod_delay.c>
  DelayEngine       on
</IfModule>
