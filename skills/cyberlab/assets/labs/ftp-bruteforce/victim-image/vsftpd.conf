# Real vsftpd behaviour for the lab: local logins, 1 s delay after a failed login (vsftpd default).
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
delay_failed_login=1
isolate=NO
isolate_network=NO
